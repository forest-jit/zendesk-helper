<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jones IT Zendesk Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <h1>Jones IT Zendesk Helper</h1>
      <button
        id="power"
        type="button"
        role="switch"
        aria-label="Jones IT Zendesk Helper"
        aria-checked="true"
      >
        <span class="switch-track" aria-hidden="true"></span><span id="power-label">On</span>
      </button>
    </header>
    <label for="theme-trigger">Theme</label>
    <select id="theme" hidden aria-hidden="true" tabindex="-1"></select>
    <button
      id="theme-trigger"
      class="secondary theme-trigger"
      type="button"
      role="combobox"
      aria-label="Theme"
      aria-expanded="false"
      aria-controls="theme-options"
      aria-haspopup="listbox"
    >
      <span id="theme-name">Theme</span><span aria-hidden="true">⌄</span>
    </button>
    <div id="theme-options" role="listbox" aria-label="Themes" hidden></div>
    <section class="theme-preview" aria-label="Theme preview">
      <div class="preview-heading">Ticket preview <span>Open</span></div>
      <p class="preview-message">Thanks for the update.</p>
      <p class="preview-note">Internal note · Only your team can see this.</p>
      <button type="button" class="preview-send" tabindex="-1">Send</button>
    </section>

    <footer class="popup-footer">
      <button id="settings" class="secondary" type="button">Settings</button>
    </footer>
    <p id="status" role="status"></p>
    <script src="../shared/themes.js"></script>
    <script src="../shared/theme-controls.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
