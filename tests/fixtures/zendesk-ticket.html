<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synthetic Zendesk ticket</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui; }
  [data-test-id$="-standard-layout"] { display: grid; grid-template-columns: 280px minmax(0, 1fr) 260px; min-height: 720px; }
  [data-test-id^="column-"] { padding: 16px; }
  [hidden] { display: none !important; }
</style>
<body>
  <section data-test-id="ticket-111-standard-layout" hidden>
    <aside data-test-id="column-1"><label>Cached subject<input data-test-id="omni-header-subject" value="Cached Co - Person - Issue"></label></aside>
    <main data-test-id="column-2">Cached conversation</main>
    <aside data-test-id="column-3">Cached context</aside>
  </section>
  <section data-test-id="ticket-222-standard-layout" id="active-ticket">
    <aside data-test-id="column-1" id="properties">
      <label for="active-subject">Subject</label>
      <input id="active-subject" data-test-id="omni-header-subject" value="FaceID error">
      <label for="requester">Requester</label>
      <input id="requester" value="Taylor Baxter">
      <label for="priority">Priority</label>
      <select id="priority"><option>Normal</option></select>
      <button id="properties-action" type="button">Update property</button>
    </aside>
    <main data-test-id="column-2" id="conversation">
      <h1>FaceID error</h1>
      <p>Fictional conversation content for layout testing.</p>
      <label for="reply">Internal note</label>
      <textarea id="reply"></textarea>
      <button id="save" type="button">Save changes</button>
    </main>
    <aside data-test-id="column-3" id="context">Fictional customer context</aside>
  </section>
  <label for="manual-title">Manual title fallback</label>
  <input id="manual-title" value="Manual issue">
</body>
</html>
