<!doctype html><html lang="en"><meta charset="utf-8"><title>Zendesk helper</title>
<link rel="stylesheet" href="popup.css">
<h1>Zendesk helper</h1>
<label><input type="checkbox" id="layout" checked> Conversation left, ticket fields right</label>
<label><input type="checkbox" id="context"> Also show customer context / apps</label>
<label>Workspace appearance<select id="theme"><option value="system">System</option><option value="calm">Calm</option><option value="contrast">High contrast</option></select></label>
<p>The overlay loads automatically. Title warnings appear when you leave the subject field.</p>
<button id="enable">Apply settings</button><button id="disable">Turn off</button>
<details><summary>Title not detected?</summary><button id="manual">Select title manually</button></details>
<p id="status" role="status">Loading settings…</p><script src="popup.js"></script></html>
